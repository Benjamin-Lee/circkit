name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check locked workspace
        run: cargo +stable check --workspace --all-targets --locked

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test locked workspace
        run: cargo +stable test --workspace --locked
      - name: Test portable benchmark reports
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting and all targets/features
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

  minimum-rust:
    name: Minimum Rust (1.85)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check locked workspace on minimum Rust
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked
