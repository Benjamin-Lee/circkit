name: Performance portability

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  native-arm:
    name: Native ARM (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm native ARM and install stable Rust
        run: |
          case "$(uname -m)" in arm64|aarch64) ;; *) exit 1 ;; esac
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -vV
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify default and scalar normalization
        run: |
          cargo test --workspace --locked
          cargo test --locked --features scalar-normalization --test performance_normalize
      - name: Test portable benchmark reports
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Smoke-test native benchmarking
        run: python3 benchmarks/run.py --suite smoke --trials 2 --warmups 0 --threads 1 --no-tuning --no-scalar --output target/benchmark-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: |
            target/benchmark-smoke/report.zip
            target/benchmark-smoke/build-*.log
