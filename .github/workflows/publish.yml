name: Publish crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested tag to crates.io
    # Initial publication is manual; see docs/releasing.md for bootstrap steps.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require a validated release on main
        run: |
          python3 dist/release.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$RELEASE_TAG" --json assets > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'dist')
          from release import configuration
          version, config = configuration()
          assets = {asset['name'] for asset in json.load(open('release.json'))['assets']}
          required = {f'circkit-{version}-{item["target"]}.tar.gz' for item in config['targets']}
          required |= {f'{crate}-{version}.crate' for crate in ('circkit', 'circkit-cli')}
          required.add('SHA256SUMS')
          assert required <= assets, 'Build all release packages before publishing'
          PY
      - name: Install pinned release toolchain
        run: |
          RELEASE_RUST=$(python3 -c 'import tomllib; print(tomllib.load(open("dist/config.toml", "rb"))["rust"])')
          rustup toolchain install "$RELEASE_RUST" --profile minimal
          rustup default "$RELEASE_RUST"
      - name: Recheck tests and crates before authentication
        run: |
          cargo test --workspace --locked
          cargo publish --workspace --dry-run --locked
      - name: Obtain short-lived crates.io credentials
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish library then CLI in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
