[package]
name = "circkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Benjamin D. Lee <benjamin.lee@chch.ox.ac.uk>"]
description = "Algorithms for circular DNA and RNA sequences."
license = "MIT"
repository = "https://github.com/Benjamin-Lee/circkit"
documentation = "https://docs.rs/circkit"
keywords = ["bioinformatics", "bio", "genomics", "fasta"]
categories = ["science"]
readme = "README.md"
include = ["/src/**", "/tests/**", "/proptest-regressions/**", "/README.md", "/LICENSE"]

[dependencies]
bio = "1.3.1"
log = "0.4.17"
derive_builder = "0.11.2"
memchr = "2.8.3"
aho-corasick = "1.0.1"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.15.0"
proptest = "1.0.0"
