[package]
name = "circkit-cli"
version = "0.1.0"
authors = ["Benjamin D. Lee <benjamin.lee@chch.ox.ac.uk>"]
description = "A toolkit for working with circular sequences."
license = "MIT"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/Benjamin-Lee/circkit"
keywords = ["bioinformatics", "bio", "genomics", "fasta"]
categories = ["science", "command-line-interface"]
readme = "README.md"
include = ["/src/**", "/docs/cli.md", "/docs/install.md", "/README.md", "/LICENSE", "/Cargo.lock"]

[dependencies]
bio = "1.3.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap-verbosity-flag = "3.0.4"
env_logger = "0.10.0"
log = "0.4.17"
circkit = { path = "lib", version = "0.1.0" }
anyhow = "1.0"
needletail = "0.5.1"
seq_io = "0.3.4"
niffler = "2.5.0"
# Select the SIMD-accelerated pure Rust gzip implementation used by niffler.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.4.4"
xz2 = "0.1.7"
zstd = "0.12.3"
same-file = "1.0.6"
aho-corasick = "1.0.1"
csv = "1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
nohash-hasher = "0.2.0"
xxhash-rust = { version = "0.8.6", features = ["xxh3"] }


[dev-dependencies]
assert_cmd = "2.0.4"
assert_fs = "1.0"
predicates = "3.0.3"
rstest = "0.15.0"

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
members = ["lib"]
resolver = "2"

[features]
# Allows the SIMD normalization fast path to be compared with its portable fallback.
scalar-normalization = []
# Bundle compression libraries for redistributable binaries on Linux and macOS.
static-codecs = ["bzip2/static", "xz2/static"]

[[bin]]
name = "circkit"
path = "src/main.rs"
